services:

  # ── PostgreSQL exclusivo de ms-logistica ──────────────────────────
  logistica-db:
    image: postgres:15-alpine
    container_name: logistica-db
    environment:
      POSTGRES_DB: ${LOGISTICA_POSTGRES_DATABASE:?LOGISTICA_POSTGRES_DATABASE is required}
      POSTGRES_USER: ${LOGISTICA_POSTGRES_USERNAME:?LOGISTICA_POSTGRES_USERNAME is required}
      POSTGRES_PASSWORD: ${LOGISTICA_POSTGRES_PASSWORD:?LOGISTICA_POSTGRES_PASSWORD is required}
    ports:
      - "5435:5432"       # Puerto externo 5435 para no chocar con otros ms
    volumes:
      - logistica_data:/var/lib/postgresql/data
    networks:
      - innovatech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOGISTICA_POSTGRES_USERNAME} -d ${LOGISTICA_POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ (compartido entre microservicios) ────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "5672:5672"       # AMQP
      - "15672:15672"     # Management UI → http://localhost:15672
    networks:
      - innovatech-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ms-logistica ──────────────────────────────────────────────────
  ms-logistica:
    build: .
    container_name: ms-logistica
    ports:
      - "8084:8084"
    environment:
      LOGISTICA_POSTGRES_HOST: ${LOGISTICA_POSTGRES_HOST:-logistica-db}
      LOGISTICA_POSTGRES_PORT: ${LOGISTICA_POSTGRES_PORT:-5432}
      LOGISTICA_POSTGRES_DATABASE: ${LOGISTICA_POSTGRES_DATABASE:?LOGISTICA_POSTGRES_DATABASE is required}
      LOGISTICA_POSTGRES_USERNAME: ${LOGISTICA_POSTGRES_USERNAME:?LOGISTICA_POSTGRES_USERNAME is required}
      LOGISTICA_POSTGRES_PASSWORD: ${LOGISTICA_POSTGRES_PASSWORD:?LOGISTICA_POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    depends_on:
      logistica-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - innovatech-network
    restart: on-failure

volumes:
  logistica_data:

networks:
  innovatech-network:
    name: innovatech-network
    driver: bridge
