spring:
  datasource:
    url: jdbc:mysql://${LOGISTICA_MYSQL_HOST:localhost}:${LOGISTICA_MYSQL_PORT:3306}/${LOGISTICA_MYSQL_DATABASE:logistica_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${LOGISTICA_MYSQL_USERNAME:logistica_local}
    password: ${LOGISTICA_MYSQL_PASSWORD:logistica_local_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:rabbit_local_user}
    password: ${RABBITMQ_PASSWORD:rabbit_local_password}
    listener:
      simple:
        default-requeue-rejected: false
