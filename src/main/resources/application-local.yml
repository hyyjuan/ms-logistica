spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:${LOGISTICA_MYSQL_HOST:localhost}}:${DB_PORT:${LOGISTICA_MYSQL_PORT:3306}}/${DB_NAME:${LOGISTICA_MYSQL_DATABASE:innovatech_logistica}}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:${LOGISTICA_MYSQL_USERNAME:root}}
    password: ${DB_PASSWORD:${LOGISTICA_MYSQL_PASSWORD:change_me_local_logistica}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:rabbit_local_user}
    password: ${RABBITMQ_PASSWORD:rabbit_local_password}
    listener:
      simple:
        default-requeue-rejected: false
